# Run `pre-commit install` once after checkout, then hooks fire on git commit.
# Optional — CI enforces the same checks.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--strict, src/polysim]
        additional_dependencies:
          - pydantic>=2.7
          - pydantic-settings>=2.3
          - types-PyYAML

  - repo: local
    hooks:
      - id: polysim-safety-grep
        name: polysim — forbid order-placement APIs
        entry: python scripts/ci_safety.py
        language: system
        pass_filenames: false
        always_run: true

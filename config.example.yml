  # Pure sports feeds — used for PM markets on game outcomes,
  # award winners, etc. (not in the spec's 11 niches, but earns its keep).
  sports:
    reddit: [sportsbook, soccer]
    telegram: []
    x: [BillSimmons, ESPNStatsInfo]
